[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "valuation-engine"
dynamic = ["version"]
description = "Investment-banking-style valuation engine (DCF, comps, LBO, Monte Carlo) for Swedish listed companies."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Arvid Lindberg" }]
keywords = ["valuation", "dcf", "lbo", "comps", "monte-carlo", "finance", "sweden"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "yfinance>=0.2.40",
    "streamlit>=1.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.5",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
]

[tool.hatch.version]
path = "src/valuation_engine/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/valuation_engine"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/PLAN.md"]

# --------------------------------------------------------------------------
# Ruff (lint + format)
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".cache", "data_cache", "output"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# Docstring rules are not enabled today; keep tests exempt if they ever are.
"tests/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["valuation_engine"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------
# Pytest and coverage
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not network"]
markers = [
    "network: test needs internet access (deselected by default; run with -m network)",
]

[tool.coverage.run]
source = ["valuation_engine"]
branch = true

[tool.coverage.paths]
source = ["src/valuation_engine", "*/site-packages/valuation_engine"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
